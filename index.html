<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    main {
      padding: 2rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 7rem);
      letter-spacing: -0.05em;
    }

    p {
      margin: 1rem 0 0;
      font-size: 1.2rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello World</h1>
    <p>¡Tu página está funcionando!</p>
  </main>
</body>
</html>
